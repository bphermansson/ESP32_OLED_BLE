; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nologo_esp32c3_super_mini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = nologo_esp32c3_super_mini
framework = arduino
build_flags =
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
    -DAUDIO_ENABLED=true
    -DBUILTINLED=2
    -DINDICATORLED=21
    -DLED_ON=HIGH
    -DLED_OFF=LOW
    -DMAX_DIN=3
    -DMAX_LRC=1
    -DMAX_BCLK=2

    -DSCREEN_WIDTH=240
    -DSCREEN_HEIGHT=320
;    -DSCREEN_WIDTH=128
;    -DSCREEN_HEIGHT=64
    -DSCREEN_ROTATION=1

;SSD1306 OLED
;    -DSSD1306_ENABLED=true
    -DCUSTOM_SDA=8
    -DCUSTOM_SCL=9

;ST7789 TFT
    -DST7789_ENABLED=true
    -DTFT_CS=0
    -DTFT_RST=10
    -DTFT_DC=20
    -DTFT_SCLK=5
    -DTFT_MOSI=6

lib_deps =
    adafruit/Adafruit GFX Library@^1.13.0
    adafruit/Adafruit SSD1306@^2.5.17
    fbiego/ChronosESP32@^1.9.1
    adafruit/Adafruit ST7735 and ST7789 Library@^1.12.0
    lvgl/lvgl@^9.6.0
